name: CLA check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Run cla-assistant (requires cla-assistant GitHub App)
        uses: cla-assistant/cla-assistant-action@v2
        with:
          configuration-path: .github/cla.yml

